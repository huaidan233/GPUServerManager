[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsm-print-agent"
version = "0.3.0rc6"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pywin32>=306",
]

[project.scripts]
gsm-print-agent = "gsm_print_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gsm_print_agent*"]

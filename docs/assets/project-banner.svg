    <rect x="14" y="14" width="115" height="106" rx="7" fill="url(#chip)"/>
    <g fill="#1d4753" opacity=".24"><rect x="26" y="27" width="23" height="22" rx="3"/><rect x="60" y="27" width="23" height="22" rx="3"/><rect x="94" y="27" width="23" height="22" rx="3"/></g>
    <text x="71.5" y="91" fill="#14333f" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="700" text-anchor="middle">GPU</text>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14">
    <rect x="927" y="68" width="216" height="52" rx="9" fill="#203a4e" stroke="#4e8296"/>

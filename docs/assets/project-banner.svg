<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">GPU Server Manager</title>
  <desc id="desc">A research team's compute workspace. GPU resources connect to containers, notebooks and private data.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#15283d"/><stop offset="1" stop-color="#203d51"/></linearGradient>
    <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#27bbc3"/><stop offset="1" stop-color="#81dad0"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#base)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <g font-family="ui-monospace, Consolas, monospace">
    <path d="M52 54h22m-11-11v22" stroke="#69d5cf" stroke-width="2"/>
    <text x="88" y="60" fill="#b1c8d6" font-size="13" letter-spacing="3">RESEARCH COMPUTE, TOGETHER</text>
    <text x="54" y="147" fill="#f1f6f5" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="700" letter-spacing="-1.5">GPU Server Manager</text>
    <text x="56" y="192" fill="#b1c8d6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">算力有序分配 · 环境随时就绪 · 数据各有所属</text>
    <path d="M56 234h44" stroke="#69d5cf" stroke-width="3"/>
    <text x="56" y="279" fill="#8faabb" font-size="13" letter-spacing="1.8">SELF-HOSTED / GPU / DOCKER / NOTEBOOKS</text>
  </g>
  <g stroke="#4e8296" stroke-width="2" fill="none">

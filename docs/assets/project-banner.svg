      <path d="M20 0v-15m25 15v-15m25 15v-15m25 15v-15m25 15v-15M20 134v15m25-15v15m25-15v15m25-15v15m25-15v15M0 20h-15m15 25h-15m15 25h-15m15 25h-15m15 25h-15M143 20h15m-15 25h15m-15 25h15m-15 25h15m-15 25h15"/>
    </g>

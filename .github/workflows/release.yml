name: Release source package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (e.g. v0.3.0-rc.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Confirm version and release channel
        run: |
          python - <<'PY'
          import json, os, re
          v = json.load(open('package.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?', v)
          assert os.environ['RELEASE_TAG'] == 'v' + v
          PY
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > /tmp/gsm-release.json
          python - <<'PY'
          import json, os
          release = json.load(open('/tmp/gsm-release.json'))
          assert not release['isDraft']
          assert release['isPrerelease'] == ('-' in os.environ['RELEASE_TAG'])
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Install and test
        run: |
          python -m pip install -c requirements/constraints.txt -e '.[dev]'
          python -m pytest
          npm ci
          npm run lint
          npm run test:web
          npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          python -m venv /tmp/gsm-audit-tools
          /tmp/gsm-audit-tools/bin/pip install pip-audit==2.10.1
          /tmp/gsm-audit-tools/bin/python -m pip_audit -r requirements/constraints.txt --no-deps --disable-pip
      - name: Scan and package public source
        run: |
          python scripts/release/check_public_source.py
          python scripts/release/build_release.py --tag "$RELEASE_TAG" --output dist/release
      - name: Attach immutable assets to the published release
        run: gh release upload "$RELEASE_TAG" dist/release/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
